project_id = "dtlcprcpvdomrehbejhw"

# Public, no-auth agent surface. These two functions are the documented
# agent-native API and the press/cite brief export; they must be reachable
# with no Authorization header (the gateway defaults to verify_jwt = true,
# which is what broke the documented bare curl: A1).
[functions.fwi-api]
verify_jwt = false

[functions.export-brief]
verify_jwt = false

# Attribution proxy: the browser POSTs lifecycle events here with no auth header.
# The warehouse ingest secret is held server-side (env), never in the client.
[functions.emit-event]
verify_jwt = false

# Hosted MCP server: any agent host attaches by URL with no auth.
[functions.mcp]
verify_jwt = false

# Verdict Line: browser posts a one-line situation, gets a streamed grounded
# verdict. No JWT (origin-restricted in code), OpenAI-backed, token-capped.
[functions.fwi-verdict]
verify_jwt = false

# Stripe webhook: Stripe POSTs with a signature (not a Supabase JWT), so the
# gateway must not require a JWT; the function verifies the Stripe signature.
[functions.stripe-webhook]
verify_jwt = false

# Checkout: the function validates the user's token in-code (getUser) and
# returns a clean 401, so the gateway JWT check is disabled.
[functions.create-checkout-session]
verify_jwt = false

# Public RSS/JSON feed of the weekly FWI.
[functions.fwi-feed]
verify_jwt = false

# Public per-role demand indices.
[functions.fwi-roles]
verify_jwt = false

# Public Content Radar API + RSS (no-auth agent/syndication surface).
[functions.content-api]
verify_jwt = false

[functions.content-feed]
verify_jwt = false

# Pipeline + alerting internals stay JWT-verified (service-role only).
[functions.ingest-signals]
verify_jwt = true

[functions.calculate-fwi]
verify_jwt = true

[functions.generate-pulse-insights]
verify_jwt = true

[functions.backfill-historical]
verify_jwt = true

[functions.send-pipeline-alert]
verify_jwt = true

# Content Radar internals (service-role / cron only).
[functions.harvest-content-signals]
verify_jwt = true

[functions.generate-content-radar]
verify_jwt = true

[functions.send-content-brief]
verify_jwt = true
