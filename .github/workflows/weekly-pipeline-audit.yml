# Weekly read-only audit of the Pulse data pipeline.
#
# This is a backstop against the audit silently not happening — the failure mode
# the pipeline is most prone to, since a scheduler that stops produces no signal
# at all. It needs no secrets: scripts/pipeline-audit.mjs reads only public data
# and writes nothing.
#
# It does not replace the judgement half of docs/WEEKLY_PIPELINE_AUDIT.md.
# Nothing here decides whether a failing source is worth keeping.
name: Weekly pipeline audit

on:
  schedule:
    # Mondays 07:00 UTC — an hour after the 06:00 daily ingest, so the audit
    # sees the day it is auditing.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci` — the audit is dependency-free on purpose, so a broken
      # lockfile can never be the reason the pipeline goes unwatched.
      - name: Run audit
        id: audit
        run: |
          set +e
          node scripts/pipeline-audit.mjs > audit.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat audit.txt
          {
            echo 'report<<AUDIT_EOF'
            cat audit.txt
            echo 'AUDIT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when degraded
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.audit.outputs.report }}
          CODE: ${{ steps.audit.outputs.exit_code }}
        with:
          script: |
            const code = process.env.CODE;
            const verdict = code === '2' ? '🔴 RED' : code === '1' ? '🟡 AMBER' : '⚠️ audit could not run';
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${verdict} — weekly pipeline audit ${today}`,
              labels: ['pipeline-audit'],
              body: [
                `Automated run of \`scripts/pipeline-audit.mjs\`. Exit code \`${code}\`.`,
                '',
                'Findings are facts; the decisions in §2 of `docs/WEEKLY_PIPELINE_AUDIT.md`',
                'still need a person. Nothing here has been fixed.',
                '',
                '```',
                process.env.REPORT,
                '```',
              ].join('\n'),
            });
