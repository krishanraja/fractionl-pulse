# Daily check that the published index is what the method says it should be.
#
# Krish, 2026-10-23: "all of this needs to be antifragile, claude schedules
# suck." This replaces session check-ins: it runs whether or not anyone is
# watching, fails loudly, and heals its own issue when the next run passes.
#
# 09:15 UTC: after the 06:00 ingest, the 06:40 rebuild, the 08:00 backstop
# ingest and the 08:40 rebuild, so a day the backstop rescued is not reported
# as a failure. Read-only; needs no secrets.
#
# Note: GitHub pauses scheduled workflows in a repository with no activity for
# 60 days. This repository commits daily (the docs steward), so it does not.
name: Daily publication check

on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commits the day's line to docs/citability-log.jsonl
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check today's publication
        id: check
        run: |
          set +e
          node scripts/publication-check.mjs > check.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat check.txt
          {
            echo 'report<<CHECK_EOF'
            cat check.txt
            echo 'CHECK_EOF'
          } >> "$GITHUB_OUTPUT"
          { echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The North Star (Krish, 2026-10-26): hold 10/10 for months. Score all ten
      # points from live evidence every day and keep the record in the repo,
      # where a buyer can audit it. Runs whatever the publication check found.
      - name: Score citability and record the day
        id: cite
        continue-on-error: true   # never blocks the publication alert below
        run: |
          set +e
          node scripts/citability.mjs --record > cite.txt 2>&1
          code=$?
          cat cite.txt
          { echo '```'; cat cite.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          node scripts/citability.mjs --json 2>/dev/null > cite.json
          echo "score=$(node -e "console.log(require('./cite.json').score)")" >> "$GITHUB_OUTPUT"
          echo "prev=$(tail -n 2 docs/citability-log.jsonl | head -n 1 | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).score)}catch{console.log('')}})")" >> "$GITHUB_OUTPUT"
          {
            echo 'report<<CITE_EOF'
            cat cite.txt
            echo 'CITE_EOF'
          } >> "$GITHUB_OUTPUT"
          exit $code

      - name: Commit the citability record
        if: steps.cite.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name 'pulse-citability'
          git config user.email 'pulse-citability@users.noreply.github.com'
          git add docs/citability-log.jsonl
          git diff --cached --quiet && { echo 'already recorded today'; exit 0; }
          git commit -m "citability: $(date -u +%F) scored ${{ steps.cite.outputs.score }}/10"
          for i in 1 2 3 4; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo '::error::could not push the citability record'; exit 1

      - name: Raise an issue when the scorer itself fails
        if: steps.cite.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.issues.createLabel({ owner, repo, name: 'citability', color: 'd93f0b' }).catch(() => {});
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: 'citability', state: 'open' });
            const body = `The daily citability score did not run, so today is missing from docs/citability-log.jsonl and the streak cannot be shown. Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (open.data.some((i) => i.title.startsWith('Citability scorer failed'))) return;
            await github.rest.issues.create({ owner, repo, title: `Citability scorer failed ${new Date().toISOString().slice(0, 10)}`, labels: ['citability'], assignees: ['krishanraja'], body });

      - name: Raise an issue when the score falls from 10
        if: steps.cite.outputs.prev == '10' && steps.cite.outputs.score != '10'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.cite.outputs.report }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'citability';
            await github.rest.issues.createLabel({ owner, repo, name: label, color: 'd93f0b' }).catch(() => {});
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({ owner, repo, title: `Citability fell from 10/10 on ${today}`, labels: [label], assignees: ['krishanraja'],
              body: [`Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`, '', '```', process.env.REPORT, '```', '',
                'The streak restarts from zero. Fix the named gap; the rules are in `docs/CITABILITY.md`, the daily record in `docs/citability-log.jsonl`.'].join('\n') });

      - name: Open or update the failure issue
        if: steps.check.outputs.exit_code != '0'
        uses: actions/github-script@v7
        env:
          REPORT: ${{ steps.check.outputs.report }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'publication-check';
            await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205' }).catch(() => {});
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              '', '```', process.env.REPORT, '```', '',
              'Read the failing line, not the exit code. The method and the rulings are in `docs/CITABILITY.md`; the seam logic is in `supabase/functions/calculate-fwi/v2.ts`.',
              'This issue closes itself when a later daily run passes.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open' });
            if (open.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body: `Still failing on ${today}.\n\n${body}` });
            } else {
              await github.rest.issues.create({ owner, repo, title: `Publication check failed ${today}`, labels: [label], assignees: ['krishanraja'], body });
            }
            core.setFailed('publication check failed');

      - name: Close the failure issue once passing
        if: steps.check.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, labels: 'publication-check', state: 'open' });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Passing again: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
