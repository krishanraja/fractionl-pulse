# Deploy Supabase edge functions on every push to main that changes them.
#
# Why: the serpapi_linkedin ratio guard was committed on 2026-10-13 and never
# deployed; production ran the 2026-09-24 build for ten days and nothing
# noticed. Deploying from main on merge removes that class of drift.
# (Ruling, Krish, 2026-10-23.)
#
# What it deploys: each function whose own directory changed, plus every
# function that imports a changed file under supabase/functions/_shared/.
# verify_jwt for each comes from supabase/config.toml, which was checked against
# every deployed function on 2026-10-23 (22 of 22 match).
#
# What it never does: apply migrations. Migrations carry ordering rules in their
# own headers and stay a deliberate, recorded step.
#
# Needs the repository secret SUPABASE_ACCESS_TOKEN (a Supabase personal access
# token). Until it exists the job reports what it would have deployed and stops
# with a warning, so the gap is visible in every run.
name: Deploy edge functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:
    inputs:
      functions:
        description: 'Space-separated function names to deploy (blank = changed in the last commit)'
        required: false

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: dtlcprcpvdomrehbejhw
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests for the shared method and collectors
        run: |
          node --test supabase/functions/_shared/fwi-method.test.ts \
                      supabase/functions/_shared/trials.test.ts \
                      supabase/functions/_shared/dataforseo.test.ts \
                      supabase/functions/_shared/outlier.test.ts

      - name: Work out which functions changed
        id: plan
        env:
          REQUESTED: ${{ github.event.inputs.functions }}
        run: |
          if [ -n "$REQUESTED" ]; then
            fns=$(echo "$REQUESTED" | tr -cd 'a-z0-9 -')
          else
            changed=$(git diff --name-only HEAD~1 HEAD -- supabase/functions supabase/config.toml)
            fns=""
            for f in $changed; do
              case "$f" in
                supabase/functions/_shared/*)
                  shared=$(basename "$f")
                  for dir in supabase/functions/*/; do
                    name=$(basename "$dir")
                    [ "$name" = "_shared" ] && continue
                    grep -rqs "_shared/$shared" "$dir" && fns="$fns $name"
                  done ;;
                supabase/functions/*/*)
                  fns="$fns $(echo "$f" | cut -d/ -f3)" ;;
              esac
            done
          fi
          fns=$(echo $fns | tr ' ' '\n' | sort -u | grep -v '^$' | tr '\n' ' ')
          echo "functions=$fns" >> "$GITHUB_OUTPUT"
          echo "Would deploy: ${fns:-nothing}"

      - name: Check the access token exists
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PLANNED: ${{ steps.plan.outputs.functions }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=Edge functions not deployed::SUPABASE_ACCESS_TOKEN is not set. These changed functions were NOT deployed: $PLANNED"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Pinned: `latest` resolves through GitHub's unauthenticated API and failed
      # on its rate limit on 2026-10-23, deploying nothing. A pinned version is a
      # plain release download.
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true' && steps.plan.outputs.functions != ''
        with:
          version: 2.120.0

      - name: Deploy
        if: steps.token.outputs.ok == 'true' && steps.plan.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PLANNED: ${{ steps.plan.outputs.functions }}
        run: |
          for fn in $PLANNED; do
            [ -f "supabase/functions/$fn/index.ts" ] || { echo "skip $fn (no index.ts; removed?)"; continue; }
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
            echo "::endgroup::"
          done

      - name: Read back deployed versions
        if: steps.token.outputs.ok == 'true' && steps.plan.outputs.functions != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PLANNED: ${{ steps.plan.outputs.functions }}
        run: |
          for fn in $PLANNED; do
            curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$fn" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['slug'], 'v', d['version'], 'verify_jwt', d['verify_jwt'], d['status'])"
          done
